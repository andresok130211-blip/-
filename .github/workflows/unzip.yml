name: Auto Unzip Files

on:
  push:
    paths:
      - '**.zip' # Запускать только при загрузке zip-файлов

permissions:
  contents: write # Разрешение на изменение файлов в репозитории

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код репозитория
        uses: actions/checkout@v4

      - name: Распаковать и удалить архивы
        run: |
          find . -name "*.zip" -exec sh -c '
            for zip_file do
              dir=$(dirname "$zip_file")
              unzip -o "$zip_file" -d "$dir"
              rm "$zip_file"
            done
          ' sh {} +

      - name: Сохранить изменения в репозиторий
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Автоматическая распаковка архива" || exit 0
          git push
