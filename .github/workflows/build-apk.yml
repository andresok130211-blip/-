name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код проекта
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Кэшировать папку Library
        uses: actions/cache@v4
        with:
          path: CityRunner/Library
          key: Library-CityRunner-${{ hashFiles('CityRunner/Assets/**', 'CityRunner/Packages/**', 'CityRunner/ProjectSettings/**') }}
          restore-keys: |
            Library-CityRunner-

      - name: Собрать Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: CityRunner
          targetPlatform: Android
          androidExportType: androidPackage

      - name: Загрузить готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: Build-Android
          path: build/Android

